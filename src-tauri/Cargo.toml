[package]
name = "gameshrink"
version = "4.0.0"
default-run = "gameshrink"
description = "Smart Game Compressor with Ultra Pack Auto-Launch Proxy, Instant Re-Seal, NTFS LZX & Live Update Watcher"
authors = ["GameShrink"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "gameshrink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gameshrink"
path = "src/main.rs"

[[bin]]
name = "gs_shim"
path = "src/shim_main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1.5"
walkdir = "2.5"
rayon = "1.10"
zstd = "0.13"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
