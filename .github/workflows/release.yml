name: Release GameShrink (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build gs_shim proxy launcher
        shell: pwsh
        run: |
          cargo build --release --bin gs_shim --manifest-path src-tauri/Cargo.toml
          New-Item -ItemType Directory -Force -Path src-tauri/resources
          Copy-Item src-tauri/target/release/gs_shim.exe src-tauri/resources/gs_shim.exe -Force

      - name: Build Tauri NSIS & MSI installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "GameShrink v__VERSION__"
          releaseBody: "Windows NSIS (.exe) and MSI installers for GameShrink v__VERSION__."
          releaseDraft: true
          prerelease: false
